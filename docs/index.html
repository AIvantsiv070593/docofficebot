<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DocOfficeBot</title>
  <style>
    :root {
      --bg: #f7f4ef;
      --ink: #1c1917;
      --muted: #57534e;
      --line: #d6d3d1;
      --accent: #0f766e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% 0%, #ddeae7 0%, transparent 55%),
        var(--bg);
      line-height: 1.5;
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 3.5rem 1.25rem 4rem;
    }
    h1 {
      margin: 0 0 0.35rem;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      letter-spacing: -0.02em;
    }
    p { color: var(--muted); margin: 0.75rem 0; }
    a { color: var(--accent); }
    nav {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 1.5rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>DocOfficeBot</h1>
    <p>
      Внутренний Telegram-бот офиса для отправки накладных в DocsInBox
      и ведения реестра в Google Sheets.
    </p>
    <p>
      Канал: <a href="https://t.me/officesakh/">t.me/officesakh</a>
    </p>
    <nav>
      <a href="privacy.html">Политика конфиденциальности</a>
      <a href="https://github.com/AIvantsiv070593/docofficebot">Код на GitHub</a>
    </nav>
  </main>
</body>
</html>
