[project]
name = "docofficebot"
version = "1.0.0"
description = "Telegram bot for invoice album forwarding to DocsInBox"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "aiogram>=3.13,<4",
    "aiosqlite>=0.20",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic-settings>=2.5",
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "Pillow>=10.4",
    "pillow-heif>=0.18",
    "httpx>=0.27",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
